  /* ---- Dark mode: espresso ground, cream ink, brighter teal accent ---- */

    --bg:            #1A110D;
    --bg-2:          #241712;
    --bg-3:          #2E1E17;
    --surface:       #1A110D;

    --coa-ink:    #4FD0C4;
    --coa-dot:    #2FB7AC;
    --coa-soft-2: #3E8C85;
    --coa-halo:   rgba(47,183,172,0.20);
    --pour-strength-rgb: 234,219,192;
    --shadow-1: 0 1px 0 rgba(0,0,0,.18), 0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-2: 0 2px 0 rgba(0,0,0,.2), 0 18px 40px -16px rgba(0,0,0,.6);
  }
  html, body { margin: 0; padding: 0; }
  * { -webkit-tap-highlight-color: transparent; }
  @keyframes coaPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
