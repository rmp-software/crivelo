<!doctype html>
<!-- @dsCard group="Colors" name="Semantic states" subtitle="Success (sage) · Danger (clay) — semantic only" viewport="700x190" -->
<html><head><meta charset="utf-8"><title>Semantic state colors</title><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(2,1fr);gap:14px;max-width:440px">
    <div class="swatch">
      <div class="swatch-chip" style="background:var(--sage-500);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-mono);font-weight:600;font-size:13px;letter-spacing:.04em">success</div>
      <div class="swatch-label"><span class="swatch-name">sage-500</span><span>#4F8C72</span></div>
      <div>--success · salvo, concluído</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:var(--clay-500);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-mono);font-weight:600;font-size:13px;letter-spacing:.04em">danger</div>
      <div class="swatch-label"><span class="swatch-name">clay-500</span><span>#B83A2E</span></div>
      <div>--danger · destrutivo, erro</div>
    </div>
  </div>
  <div class="note" style="margin-top:6px">só dois estados semânticos. a casa não tem acento — ênfase vem de tinta + tipografia, nunca de cor decorativa.</div>
</div>
</body></html>
