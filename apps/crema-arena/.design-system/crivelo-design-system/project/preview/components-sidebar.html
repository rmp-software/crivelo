<!doctype html>
<!-- @dsCard group="Components" name="Sidebar" subtitle="Espresso panel · ink-on-cream active route · endorsement lockup" viewport="880x580" -->
<html><head><meta charset="utf-8"><title>Sidebar nav</title><link rel="stylesheet" href="_card.css">
<style>
  /* Mirrors app/components/Sidebar.tsx — espresso panel, crema text, and an
   * ink-on-cream fill for the active route (no accent color — the house stays
   * neutral). Light-variant wordmark + "by Crivelo" endorsement inside. */
  .frame { display:flex; gap:18px; width:100%; max-width:760px; margin:0 auto; height:480px; }
  .sb {
    width:260px; min-height:100%; background:var(--espresso-900);
    color:var(--crema-50); display:flex; flex-direction:column;
    border-radius:var(--radius-md); overflow:hidden;
  }
  .sb-head { padding:20px; border-bottom:1px solid var(--espresso-700); }
  .mark { display:inline-flex; align-items:center; gap:12px; }
  .mark svg { width:30px; height:30px; flex-shrink:0; }
  .mark .stack { display:flex; flex-direction:column; gap:2px; line-height:1; }
  .mark .product { font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:-0.02em; color:var(--crema-50); }
  .mark .by { font-family:var(--font-body); font-size:11px; color:var(--crema-300); }
  .mark .by b { color:var(--crema-50); font-weight:600; }
  .role { margin-top:10px; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--crema-300); }

  .sb-nav { flex:1; padding:14px 10px; display:flex; flex-direction:column; gap:4px; }
  .sb-item {
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:var(--radius-sm);
    color:var(--crema-100); font-size:14px; font-weight:500; text-decoration:none;
    cursor:pointer; transition: background var(--dur-base) var(--ease-standard), color var(--dur-base) var(--ease-standard);
    min-height:44px;
  }
  .sb-item:hover { background:var(--espresso-700); color:var(--crema-50); }
  .sb-item.active { background:var(--crema-50); color:var(--espresso-900); }
  .ico { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.75; flex-shrink:0; }

  .sb-foot { padding:14px; border-top:1px solid var(--espresso-700); }
  .who { display:flex; flex-direction:column; gap:2px; padding:0 8px 12px; }
  .who .name { font-weight:500; font-size:14px; color:var(--crema-50); }
  .who .em   { font-size:12px; color:var(--crema-200); }
  .logout {
    width:100%; min-height:36px; padding:8px 12px;
    display:inline-flex; align-items:center; gap:8px;
    background:transparent; border:none; cursor:pointer;
    color:var(--crema-100); font-size:14px; font-weight:500; border-radius:var(--radius-sm);
  }
  .logout:hover { background:var(--espresso-700); color:var(--crema-50); }

  .plate {
    flex:1; background:var(--bg-2); border-radius:var(--radius-md);
    display:flex; align-items:center; justify-content:center;
    color:var(--fg-3); font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    padding:24px;
  }
</style>
</head>
<body>
<div class="card" style="min-height:520px;padding:24px">
  <div class="frame">
    <aside class="sb" role="navigation" aria-label="Menu principal">
      <div class="sb-head">
        <div class="mark">
          <svg viewBox="0 0 64 64" fill="var(--crema-50)" aria-hidden="true">
            <circle cx="8" cy="8" r="4"/><circle cx="20" cy="8" r="4"/><circle cx="32" cy="8" r="4"/><circle cx="44" cy="8" r="4"/><circle cx="56" cy="8" r="2" fill-opacity=".22"/>
            <circle cx="8" cy="20" r="4"/><circle cx="20" cy="20" r="2" fill-opacity=".22"/><circle cx="32" cy="20" r="2" fill-opacity=".22"/><circle cx="44" cy="20" r="2" fill-opacity=".22"/><circle cx="56" cy="20" r="2" fill-opacity=".22"/>
            <circle cx="8" cy="32" r="4"/><circle cx="20" cy="32" r="2" fill-opacity=".22"/><circle cx="32" cy="32" r="2" fill-opacity=".22"/><circle cx="44" cy="32" r="2" fill-opacity=".22"/><circle cx="56" cy="32" r="2" fill-opacity=".22"/>
            <circle cx="8" cy="44" r="4"/><circle cx="20" cy="44" r="2" fill-opacity=".22"/><circle cx="32" cy="44" r="2" fill-opacity=".22"/><circle cx="44" cy="44" r="2" fill-opacity=".22"/><circle cx="56" cy="44" r="2" fill-opacity=".22"/>
            <circle cx="8" cy="56" r="4"/><circle cx="20" cy="56" r="4"/><circle cx="32" cy="56" r="4"/><circle cx="44" cy="56" r="4"/><circle cx="56" cy="56" r="2" fill-opacity=".22"/>
          </svg>
          <span class="stack">
            <span class="product">Mesa</span>
            <span class="by">by <b>Crivelo</b></span>
          </span>
        </div>
        <div class="role">Painel</div>
      </div>

      <nav class="sb-nav">
        <a class="sb-item active">
          <svg class="ico" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Coleção
        </a>
        <a class="sb-item">
          <svg class="ico" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Catálogo
        </a>
        <a class="sb-item">
          <svg class="ico" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Receitas
        </a>
        <a class="sb-item">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Ajustes
        </a>
      </nav>

      <div class="sb-foot">
        <div class="who">
          <span class="name">Julia Ramos</span>
          <span class="em">julia@exemplo.com</span>
        </div>
        <button class="logout">
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sair
        </button>
      </div>
    </aside>

    <div class="plate">[conteúdo da página]</div>
  </div>

  <div class="caption" style="margin-top:14px;text-align:center">
    Espresso panel · crema text · ink-on-cream fill on active route · 44px touch-target floor
  </div>
</div>
</body></html>
